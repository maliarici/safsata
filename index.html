
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Safsata Türünü Bul</title>

  <!-- CHROME SEKME İKONU -->
  <link rel="icon" type="image/x-icon" href="./gantep.ico?v=2">

  <style>
    :root {
      --mor: #69346f;
      --yesil: #17803b;
      --kirmizi: #cf3030;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f5f8;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    main {
      max-width: 1050px;
      margin: 0 auto;
      padding: 24px 18px 50px;
    }

    .site-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      margin-bottom: 22px;
    }

    .uni-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
    }

    h1 {
      color: var(--mor);
      text-align: center;
      font-size: clamp(24px, 3.5vw, 34px);
      margin: 0;
    }

    .status {
      background: white;
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      font-weight: 700;
      box-shadow: 0 3px 12px #0000000b;
    }

    .bar {
      height: 9px;
      background: #e8dfeb;
      border-radius: 100px;
      overflow: hidden;
      margin: 12px 0 22px;
    }

    .bar-fill {
      height: 100%;
      width: 0;
      background: var(--mor);
      transition: width .25s ease;
    }

    .case {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 3px 12px #0000000b;
    }

    .case p {
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.65;
      margin: 0;
    }

    .instruction {
      margin: 22px 0 12px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: #5b4b5e;
    }

    /* BUTONLAR */

    .options {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      align-items: stretch;
    }

    .option {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border: 3px solid #ded5e1;
      border-radius: 12px;
      background: white;
      cursor: pointer;
      min-width: 0;
      box-shadow: 0 3px 10px #0000000b;
      transition:
        border-color .2s,
        background-color .2s,
        transform .15s;
    }

    .option:not(:disabled):not(.wrong):hover {
      border-color: var(--mor);
      transform: translateY(-2px);
    }

    .option:focus-visible,
    .next:focus-visible {
      outline: 3px solid #4b9aff;
      outline-offset: 3px;
    }

    .option img {
      display: block;
      width: 100%;
      height: 145px;
      object-fit: contain;
    }

    /* YANLIŞ: KIRMIZI */

    .option.wrong {
      background: #ffdddd;
      border-color: var(--kirmizi);
      box-shadow: 0 0 0 2px #f5b5b5;
    }

    /* DOĞRU: YEŞİL */

    .option.correct {
      background: #e7f8eb;
      border-color: var(--yesil);
      box-shadow: 0 0 0 2px #b8eac7;
    }

    .option:disabled {
      cursor: default;
      opacity: 1;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 24px;
    }

    .next {
      background: var(--mor);
      color: white;
      padding: 14px 25px;
      border: 0;
      border-radius: 11px;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
    }

    .next:disabled {
      background: #aaa4ae;
      cursor: not-allowed;
    }

    /* SONUÇ EKRANI */

    .finish {
      display: none;
      background: white;
      border-radius: 16px;
      text-align: center;
      padding: 35px 20px;
      margin-top: 22px;
      box-shadow: 0 3px 12px #0000000b;
    }

    .finish h2 {
      color: var(--mor);
      font-size: 28px;
    }

    .finish p {
      font-size: 21px;
      line-height: 1.6;
    }

    .perfect-message {
      color: var(--yesil);
      font-weight: bold;
      font-size: 24px !important;
    }

    /* TABLET: 3 + 3 */

    @media (max-width: 850px) {
      .options {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .option img {
        height: 145px;
      }
    }

    /* TELEFON: 3 + 3 */

    @media (max-width: 550px) {
      main {
        padding: 16px 12px 36px;
      }

      .site-header {
        gap: 10px;
      }

      .uni-logo {
        width: 45px;
        height: 45px;
      }

      .case {
        padding: 18px;
      }

      .status {
        padding: 13px 14px;
        font-size: 14px;
      }

      .options {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 7px;
      }

      .option {
        padding: 3px;
        border-width: 2px;
        border-radius: 9px;
      }

      .option img {
        width: 100%;
        height: 115px;
        object-fit: contain;
      }

      .instruction {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

<main>

  <!-- ÜST LOGO VE BAŞLIK -->

  <!-- DURUM VE PUAN -->

  <section class="status">
    <span id="counter">Durum 1 / 15</span>
    <span id="score">İlk denemede doğru: 0</span>
  </section>

  <div class="bar">
    <div class="bar-fill" id="barFill"></div>
  </div>

  <!-- OYUN ALANI -->

  <section id="game">

    <article class="case">
      <p id="caseText"></p>
    </article>

    <div id="options" class="options"></div>

    <div class="actions">
      <button id="next" class="next" disabled>
        Sonraki
      </button>
    </div>

  </section>

  <!-- SONUÇ EKRANI -->

  <section id="finish" class="finish">

    <h2>Çalışma Tamamlandı!</h2>

    <p id="result"></p>

    <button id="restart" class="next">
      Yeniden Başla
    </button>

  </section>

</main>

<script>

  // 6 GÖRSEL

  const types = [
    {
      key: "adam-karalama",
      name: "Adam Karalama",
      image: "adam-karalama.png"
    },
    {
      key: "aceleci-genelleme",
      name: "Aceleci Genelleme",
      image: "aceleci-genelleme.png"
    },
    {
      key: "cimbizlama",
      name: "Cımbızlama",
      image: "cimbizlama.png"
    },
    {
      key: "korkuluk",
      name: "Korkuluk",
      image: "korkuluk.png"
    },
    {
      key: "yanlis-ikilem",
      name: "Yanlış İkilem",
      image: "yanlis-ikilem.png"
    },
    {
      key: "safsata-yok",
      name: "Safsata Yok",
      image: "safsata-yok.png"
    }
  ];

  // 15 DURUM

  const situations = [

    {
      text: "Bir üniversitenin faaliyet raporunda, kütüphaneden ödünç alınan kitap sayısının önceki yıla göre %28 arttığı belirtiliyor. Yönetim, bu artışı kütüphanenin giderek daha fazla öğrenciye ulaştığının göstergesi olarak sunuyor. Oysa aynı raporun ek tablolarında kütüphaneden yararlanan öğrenci sayısının %15 azaldığı ve ödünç alma işlemlerinin daha küçük bir öğrenci grubunda yoğunlaştığı görülüyor. Üniversitenin tanıtım metninde ise yalnızca ödünç alma sayısındaki artış vurgulanıyor.",
      answer: "cimbizlama"
    },

    {
      text: "Bir şehir plancısının hazırladığı meydan düzenleme projesi kamuoyunda tartışılıyor. Bir köşe yazarı, plancının geçmişte hakkında usulsüzlük iddiaları bulunan bir şirketin eski yöneticisiyle aynı dernekte görev yaptığını hatırlatıyor. Yazar, bu bağlantının projenin hangi amaçlara hizmet ettiğini anlamak için yeterli olduğunu ve rapordaki teknik gerekçeleri incelemenin gereksiz olduğunu savunuyor.",
      answer: "adam-karalama"
    },

    {
      text: "Bir grup akademisyen, üniversitelerde zorunlu devam uygulamasının sağlık sorunları, çalışma zorunluluğu ve bireysel öğrenme farklılıkları dikkate alınarak yeniden düzenlenmesini öneriyor. Fakülte kurulunun bir üyesi bu öneriye karşı çıkarak öğrencilerin yalnızca sınavlara girip diploma almasını esas alan bir üniversite anlayışının akademik disiplini ortadan kaldıracağını savunuyor.",
      answer: "korkuluk"
    },

    {
      text: "Bir gazeteci, şehir merkezindeki aynı cadde üzerinde bulunan üç kitapçıda fiyatların birbirine yakın ve oldukça yüksek olduğunu gözlemliyor. Yazısında, şehirdeki kitapçıların artık öğrencilerin bütçesine uygun seçenekler sunmadığını ileri sürüyor. Üstelik bu durumun şehir genelindeki okuma alışkanlığının azalmasında önemli bir rol oynadığını savunuyor.",
      answer: "aceleci-genelleme"
    },

    {
      text: "Bir belediyenin kültür dairesi, kütüphanelere ayrılan bütçenin daraldığını belirterek yeni bir düzenleme öneriyor. Yetkililer, mevcut kaynaklarla hem hafta sonu hizmetini sürdürmenin hem de yeni kitap almanın mümkün olmadığını savunuyor. Bu nedenle koleksiyonun güncel kalmasını isteyenlerin hafta sonu hizmetinden vazgeçmesi gerektiğini söylüyor. Ancak raporda bütçe kalemlerinin yeniden düzenlenmesi veya hizmet saatlerinin değiştirilmesi gibi seçenekler değerlendirilmiyor.",
      answer: "yanlis-ikilem"
    },

    {
      text: "Şehir merkezindeki bazı caddelerin belirli saatlerde araç trafiğine kapatılması öneriliyor. Ulaşım uzmanları, uygulamanın yaya güvenliğini artırabileceğini ve bölgedeki hava kirliliğini azaltabileceğini belirtiyor. Buna karşı çıkan bir köşe yazarı ise özel araç kullanımını bütünüyle ortadan kaldırmaya çalışan bu yaklaşımın insanların ulaşım özgürlüğünü tehdit ettiğini savunuyor.",
      answer: "korkuluk"
    },

    {
      text: "Bir belediye, yeni ulaşım hattının başarısını değerlendirmek amacıyla yolcu memnuniyeti araştırması yapıyor. Sabah saatlerinde hattı kullanan yolcuların büyük çoğunluğu hizmetten memnun olduğunu belirtiyor. Ancak akşam saatlerinde sefer yetersizliği ve uzun bekleme süreleri nedeniyle ciddi şikâyetler ortaya çıkıyor. Belediye, kamuoyuna yaptığı açıklamada sabah saatlerindeki memnuniyet oranlarını öne çıkararak hattın beklentileri karşıladığını duyuruyor.",
      answer: "cimbizlama"
    },

    {
      text: "Bir akademisyen, öğrencilerin araştırmalarında kullandıkları kaynakların doğruluğunu mutlaka kontrol etmeleri gerektiğini savunuyor. Öğrencilerden biri, akademisyenin birkaç yıl önce yayımladığı bir makalede hatalı bir kaynak gösterimi bulunduğunu hatırlatıyor. Akademisyenin kendi çalışmalarında bile bu kurala uymadığını belirterek kaynak kontrolü konusundaki önerisinin ciddiye alınamayacağını söylüyor.",
      answer: "adam-karalama"
    },

    {
      text: "Bir üniversite, öğrencilerin ideal çalışma ortamını belirlemek amacıyla anket gerçekleştiriyor. Anket, kütüphanenin sessiz çalışma salonunda bulunan 200 öğrenciye uygulanıyor. Katılımcıların büyük çoğunluğu sessiz ortamlarda daha verimli çalıştıklarını belirtiyor. Üniversite yönetimi bu sonuçtan hareketle öğrencilerin ortak çalışma ve tartışma alanlarına ihtiyaç duymadığını açıklıyor.",
      answer: "aceleci-genelleme"
    },

    {
      text: "Bir öğretim üyesi, derslerde telefon kullanımının sınırlandırılması gerektiğini, ancak bazı eğitim etkinliklerinde telefonlardan yararlanılabileceğini savunuyor. Bölüm yönetiminden bir başka akademisyen ise telefon kullanımına getirilen kısmi sınırlamaların dikkat sorununu çözmeyeceğini belirtiyor. Ona göre üniversite, ya telefonları dersliklerden tamamen uzaklaştırarak akademik disiplini koruyor ya da öğrencilerin dikkatinin dağılmasını kabul ediyor.",
      answer: "yanlis-ikilem"
    },

    {
      text: "Bir edebiyat araştırmacısı, lise müfredatında kadın yazarlara daha fazla yer verilmesinin edebiyat tarihine ilişkin bakış açısını zenginleştireceğini savunuyor. Buna karşı çıkan bir eleştirmen, edebiyatın değerini yazarların cinsiyetine göre belirlemeye çalışan bu yaklaşımın erkek yazarların eserlerini geri plana iterek edebî niteliği ikinci plana attığını ileri sürüyor.",
      answer: "korkuluk"
    },

    {
      text: "Mahallede yeni bir park yapılması gerektiğini savunan esnaf, bölgede çocukların güvenle oynayabileceği alanların yetersizliğine dikkat çekiyor. Ancak esnafın dükkânının parkın yapılması planlanan alana yakın olduğunu öğrenen bir mahalle sakini, bu önerinin yalnızca ticari kazanç beklentisinden kaynaklandığını söylüyor. Bu nedenle esnafın çocukların ihtiyaçlarıyla ilgili gerekçelerini değerlendirmeye gerek olmadığını savunuyor.",
      answer: "adam-karalama"
    },

    {
      text: "Bir kurs merkezi, yıl sonunda en yüksek puanı alan on öğrencisinin sonuçlarını yayımlayarak uyguladığı eğitim yönteminin son derece başarılı olduğunu duyuruyor. Merkezin reklamlarında bu öğrencilerin başarı hikâyelerine geniş yer veriliyor. Ancak aynı yıl kursa katılan öğrencilerin genel başarı ortalamasının önceki yıla göre düştüğü görülüyor. Kurum, bu bilgiyi tanıtım çalışmalarında paylaşmıyor.",
      answer: "cimbizlama"
    },

    {
      text: "Bir üniversitede devam zorunluluğunun yeniden düzenlenmesi tartışılıyor. Öğrenci temsilcileri, devam koşullarında belirli ölçüde esneklik sağlanmasını öneriyor. Üniversite yönetiminden bir üye ise iki yaklaşım arasında karar verilmesi gerektiğini savunuyor: Üniversite ya öğrencilerin derslere katılımını zorunlu tutarak eğitimin ciddiyetini koruyor ya da devam kararını tamamen öğrencilere bırakarak akademik disiplinden vazgeçiyor.",
      answer: "yanlis-ikilem"
    },

    {
      text: "Bir ekonomi yorumcusu, son aylarda iki büyük restoran zincirinin müşteri şikâyetlerinde artış yaşandığını belirtiyor. Bu işletmelerdeki hizmet sorunlarını değerlendirdikten sonra ülkedeki restoran sektörünün genel olarak müşteri memnuniyetini önemsememeye başladığını savunuyor. Ayrıca bu durumun sektörde çalışanların mesleki sorumluluk anlayışındaki gerilemeyi gösterdiğini ileri sürüyor.",
      answer: "aceleci-genelleme"
    }

  ];

  // OYUN DEĞİŞKENLERİ

  let index = 0;
  let firstTryCorrect = 0;
  let attemptedWrong = false;
  let solved = false;

  const counter = document.getElementById("counter");
  const score = document.getElementById("score");
  const barFill = document.getElementById("barFill");
  const caseText = document.getElementById("caseText");
  const options = document.getElementById("options");
  const next = document.getElementById("next");

  // DURUMU GÖSTER

  function showSituation() {

    solved = false;
    attemptedWrong = false;
    next.disabled = true;

    next.textContent =
      index === situations.length - 1
        ? "Sonucu Gör →"
        : "Sonraki";

    counter.textContent =
      `Durum ${index + 1} / ${situations.length}`;

    score.textContent =
      `İlk denemede doğru: ${firstTryCorrect}`;

    barFill.style.width =
      `${index / situations.length * 100}%`;

    caseText.textContent = situations[index].text;

    options.replaceChildren();

    types.forEach(type => {

      const button = document.createElement("button");
      button.type = "button";
      button.className = "option";
      button.setAttribute("aria-label", type.name);

      const img = document.createElement("img");
      img.src = type.image;
      img.alt = type.name;

      button.append(img);

      button.addEventListener("click", () => {
        choose(type.key, button);
      });

      options.append(button);

    });
  }

  // CEVAP KONTROLÜ

  function choose(key, button) {

    if (solved) return;

    const correctAnswer = situations[index].answer;

    // YANLIŞ CEVAP:
    // KIRMIZI YANAR VE 750 MS SONRA SÖNER.

    if (key !== correctAnswer) {

      attemptedWrong = true;

      button.classList.add("wrong");

      clearTimeout(button.flashTimer);

      button.flashTimer = setTimeout(() => {
        button.classList.remove("wrong");
      }, 750);

      next.disabled = true;

      return;
    }

    // DOĞRU CEVAP:
    // YEŞİL YANAR VE KALIR.

    solved = true;

    if (!attemptedWrong) {
      firstTryCorrect++;
    }

    button.classList.remove("wrong");
    button.classList.add("correct");

    score.textContent =
      `İlk denemede doğru: ${firstTryCorrect}`;

    // SEÇENEKLERİ KİLİTLE

    [...options.children].forEach(option => {
      option.disabled = true;
    });

    // SONRAKİ DURUMU AÇ

    next.disabled = false;
  }

  // SONRAKİ DURUM

  next.addEventListener("click", () => {

    if (!solved) return;

    index++;

    if (index < situations.length) {

      showSituation();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    } else {

      showResult();

    }
  });

  // SONUÇ EKRANI

  function showResult() {

    document.getElementById("game").style.display = "none";

    document.getElementById("finish").style.display = "block";

    counter.textContent =
      `Durum ${situations.length} / ${situations.length}`;

    barFill.style.width = "100%";

    const result = document.getElementById("result");

    // 15 DURUMUN TÜMÜ İLK DENEMEDE DOĞRUYSA

    if (firstTryCorrect === situations.length) {

      result.textContent =
        "Tebrikler! Tüm durumları ilk denemede doğru yanıtladınız!";

      result.className = "perfect-message";

    } else {

      result.textContent =
        `${situations.length} durumu tamamladınız. İlk denemede ${firstTryCorrect} doğru yanıt verdiniz.`;

      result.className = "";

    }

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }

  // YENİDEN BAŞLA

  document.getElementById("restart")
    .addEventListener("click", () => {

      index = 0;
      firstTryCorrect = 0;
      attemptedWrong = false;
      solved = false;

      document.getElementById("game").style.display = "block";

      document.getElementById("finish").style.display = "none";

      showSituation();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    });

  // OYUNU BAŞLAT

  showSituation();

</script>

</body>
</html>
